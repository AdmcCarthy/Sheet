name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sheet
    steps:
      - uses: actions/checkout@v4
        with:
          path: Sheet
      - uses: actions/checkout@v4
        with:
          repository: AdmcCarthy/Plate
          path: Plate
      - uses: actions/checkout@v4
        with:
          repository: AdmcCarthy/Relief
          path: Relief
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
